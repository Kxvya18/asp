[project]
name = "asp-iam"
version = "0.1.0"
description = "Agent Scoped Permissions: record the AWS calls your code (or AI agent) makes and get the least-privilege IAM policy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kxvya18" }]
keywords = ["aws", "iam", "least-privilege", "security", "boto3", "ai-agents", "devsecops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: Developers",
]
dependencies = ["boto3>=1.26"]

[project.urls]
Homepage = "https://github.com/Kxvya18/asp"
Issues = "https://github.com/Kxvya18/asp/issues"

[dependency-groups]
dev = ["pytest>=8", "moto[s3,dynamodb,sqs]>=5", "ruff>=0.5"]
examples = [
    "anthropic>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
