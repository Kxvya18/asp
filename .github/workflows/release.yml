name: release

# Push a version tag to publish:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi          # must match the "trusted publisher" set up on pypi.org
    permissions:
      id-token: write          # lets PyPI verify this workflow; no password or token stored
      contents: write          # to create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the version in pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$VERSION" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != v$VERSION"; exit 1; }
      - run: uv sync
      - name: Tests must pass before anything is published
        run: uv run pytest -q
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --notes-file CHANGELOG.md
