name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: hashicorp/setup-terraform@v3
      - run: uv sync
      - name: Generate a policy as Terraform
        run: uv run python examples/terraform_output.py
      - name: Terraform says the file is valid
        working-directory: examples/out
        run: terraform init -backend=false && terraform validate

  java-backend:
    # asp serve records a real Java service (AWS SDK for Java v2) with no change to its code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: uv sync
      - name: Record the Java backend and check its policy
        run: |
          uv run bash examples/java-backend/run.sh | tee out.txt
          grep -q '"s3:PutObject"' out.txt && grep -q 'archive/\*' out.txt && grep -q '"dynamodb:PutItem"' out.txt
